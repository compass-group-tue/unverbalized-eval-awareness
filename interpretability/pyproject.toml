[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "uea-interp"
version = "0.1.0"
description = "Probes, Jacobian Lens, Activation Oracles and steering on the UEA model organism"
requires-python = ">=3.10"
dependencies = [
    "jlens",              # from git, see [tool.uv.sources]; not on PyPI
    "torch>=2.6",
    "transformers>=5.5",
    "accelerate",
    "huggingface_hub>=0.34",
    "numpy",
    "pyyaml",
    "filelock",
    "pandas",
    "datasets",           # StrategyQA / GSM8K prompt builders
    "zstandard",          # reading inspect .eval logs
]

[project.optional-dependencies]
figures = ["matplotlib"]
peft = ["peft"]           # only if the organism is loaded as a LoRA adapter

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
jlens = { git = "https://github.com/anthropics/jacobian-lens.git", rev = "581d398613e5602a5af361e1c34d3a92ea82ba8e" }

[tool.setuptools.packages.find]
where = ["src"]
