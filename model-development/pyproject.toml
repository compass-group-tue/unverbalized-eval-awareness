[project]
name = "uea-model-organism"
version = "0.1.0"
description = "Model organism for studying unverbalised evaluation awareness: synthetic-document generation, SFT/DPO suppression training, evaluation, and judging."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Shared by every stage: CLI/data plumbing and the OpenAI-compatible clients
# used for Azure batch generation, the DeepSeek editor, and the OpenRouter judges.
dependencies = [
    "filelock",
    "httpx",
    "openai>=1.58",
    "pydantic>=2.10",
    "pyyaml",
]

[project.optional-dependencies]
# Synthetic document generation (`sdf`): Azure OpenAI batch via the core
# `openai` client. python-dotenv is optional and only loads a local `.env`.
sdf = [
    "python-dotenv",
]
# The paper ran training and inference in two separate environments with
# different library versions; the pins below are those environments. The two
# extras therefore conflict (see [tool.uv]) and belong in separate venvs.
#
# SDF LoRA, chosen-SFT and DPO training, and adapter merging (`training`,
# `evaluation.inference.merge_adapter`). The DPO/SFT `trl_qwen3_5_training`
# renderer used for the paper model additionally needs trl==1.9.0, installed
# without its dependencies so it cannot move these pins:
#   uv pip install --no-deps "trl==1.9.0"
training = [
    "accelerate==1.3.0",
    "datasets==3.2.0",
    "huggingface-hub==1.8.0",
    "peft==0.14.0",
    "safetensors==0.7.0",
    "sentencepiece==0.2.0",
    "torch==2.10.0",
    "transformers==5.3.0",
    "wandb==0.28.1",
]
# Stage-1 rollouts, final-evaluation input preparation, generation, and
# capability replay scoring (`preference_data`, `evaluation`). Generation also
# needs vllm==0.19.0 on a Linux GPU host. vLLM declares transformers<5, but the
# paper ran it with transformers 5.5.0, so install it with an override:
#   echo "transformers==5.5.0" > overrides.txt
#   uv pip install "vllm==0.19.0" --override overrides.txt
# See examples/serve_vllm.sh.
inference = [
    "datasets==5.0.1",
    "huggingface-hub==1.29.0",
    "inspect-ai==0.3.261",
    "inspect-evals==0.19.0",
    "openai==3.1.0",
    "pyarrow",
    "safetensors==0.7.0",
    "sentencepiece==0.2.1",
    "torch==2.10.0",
    "transformers==5.5.0",
]
# Official IFEval scorer, vendored in instruction_following_eval/.
ifeval = [
    "absl-py",
    "immutabledict",
    "langdetect",
    "nltk",
]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sdf*", "preference_data*", "training*", "evaluation*", "judging*"]

[tool.setuptools.package-data]
sdf = ["prompts/*.txt", "universe_contexts/*.jsonl"]
preference_data = ["prompts/*.txt", "prompts/system/*.txt"]
evaluation = ["prompts/system/*.txt", "prompts/marker_knowledge_probe/*.jsonl"]
judging = ["prompts/*.txt", "scopes/*.json"]

[tool.uv]
conflicts = [[{ extra = "training" }, { extra = "inference" }]]

[tool.uv.workspace]
members = ["instruction_following_eval"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/training"]

[tool.pyright]
exclude = ["**/node_modules",
    "**/__pycache__",
    "instruction_following_eval",
    "results",
    ".venv"
]

[tool.ruff]
ignore = [
    "E501",  # Line too long
    "F401",  # Unused import
    "F841",  # Unused variable
    "E402",  # Module level import not at top of file
]
